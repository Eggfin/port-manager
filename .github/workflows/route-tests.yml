name: Route diagnostics tests
on:
  push:
    branches: [feature/route-diagnostics, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  route-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check dependencies
        run: |
          bash --version
          jq --version
          command -v shellcheck || true
      - name: Run offline NextTrace mock tests
        run: bash tests/test-route.sh
      - name: Native nftables regression (no real firewall changes)
        run: sudo bash tests/test-nft.sh
      - name: Missing-dependency installation regression tests
        run: sudo bash tests/test-deps.sh
      - name: Offline installer and updater integration test
        run: sudo bash tests/test-install.sh
      - name: Install real NextTrace via route dependency installer
        run: |
          printf 'y\n' | sudo bash route-report.sh install
          sudo bash route-report.sh doctor
          test -x /usr/local/bin/nexttrace
      - name: NextTrace v1.7.5 real JSON smoke test (loopback)
        run: |
          curl -fLsS --retry 2 --max-time 60 -o "$RUNNER_TEMP/nexttrace" \
            https://github.com/nxtrace/NTrace-core/releases/download/v1.7.5/nexttrace_linux_amd64
          chmod +x "$RUNNER_TEMP/nexttrace"
          sudo "$RUNNER_TEMP/nexttrace" -r --json --language cn \
            --data-provider disable-geoip --no-rdns -q 2 127.0.0.1 > "$RUNNER_TEMP/loopback.json"
          jq -e '.schema_version == 1 and (.stats | type == "array") and .path_end.reason == "destination_reached"' "$RUNNER_TEMP/loopback.json"
      - name: ShellCheck new module
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S error route-report.sh
          fi
